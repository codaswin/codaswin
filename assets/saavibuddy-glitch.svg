<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" width="100%" height="110" font-family="Fira Code, Courier New, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    <![CDATA[
    .base { fill: #39ff14; font-size: 46px; font-weight: bold; }
    .layer { font-size: 46px; font-weight: bold; }
    .red   { fill: #ff2b6d; opacity: 0; }
    .cyan  { fill: #2bd8ff; opacity: 0; }

    .red  { animation: glitchRed 4.5s steps(1) infinite; }
    .cyan { animation: glitchCyan 4.5s steps(1) infinite; }
    .base { animation: glitchShift 4.5s steps(1) infinite; }

    @keyframes glitchRed {
      0%, 90% { opacity: 0; transform: translate(0,0); }
      91%     { opacity: 0.8; transform: translate(-3px,1px); }
      93%     { opacity: 0; transform: translate(0,0); }
      95%     { opacity: 0.6; transform: translate(2px,-1px); }
      97%, 100% { opacity: 0; transform: translate(0,0); }
    }
    @keyframes glitchCyan {
      0%, 90% { opacity: 0; transform: translate(0,0); }
      91%     { opacity: 0.8; transform: translate(3px,-1px); }
      93%     { opacity: 0; transform: translate(0,0); }
      95%     { opacity: 0.6; transform: translate(-2px,1px); }
      97%, 100% { opacity: 0; transform: translate(0,0); }
    }
    @keyframes glitchShift {
      0%, 90% { transform: translate(0,0); }
      92%     { transform: translate(2px,0); }
      94%     { transform: translate(-2px,0); }
      96%, 100% { transform: translate(0,0); }
    }
    ]]>
  </style>

  <text x="250" y="65" text-anchor="middle" class="layer red">SAAVIBUDDY</text>
  <text x="250" y="65" text-anchor="middle" class="layer cyan">SAAVIBUDDY</text>
  <text x="250" y="65" text-anchor="middle" class="base">SAAVIBUDDY</text>
</svg>
