<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="100%" height="260" font-family="Fira Code, Courier New, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    <![CDATA[
    .win { fill: #0a0a0a; stroke: #1a3a1a; stroke-width: 1.5; }
    .dot { }
    .title { fill: #5f8a5f; font-size: 12px; }
    .line { fill: #39ff14; font-size: 16px; }
    .line.dim { fill: #1fae2c; }
    .line.bright { fill: #d8ffe4; }
    .reveal {
      animation-name: reveal;
      animation-timing-function: steps(40, end);
      animation-fill-mode: both;
      animation-duration: 1.4s;
    }
    @keyframes reveal {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0 0 0); }
    }
    #l1 { animation-delay: 0.2s; }
    #l2 { animation-delay: 1.8s; }
    #l3 { animation-delay: 3.2s; }
    #l4 { animation-delay: 4.6s; }
    #l5 { animation-delay: 6.2s; }

    .cursor {
      animation: blink 1s steps(1) infinite;
      animation-delay: 7.6s;
      opacity: 0;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .glitch {
      animation: glitchflash 6s ease-in-out infinite;
    }
    @keyframes glitchflash {
      0%, 92%, 100% { fill: #39ff14; transform: translate(0,0); }
      93% { fill: #ff2b2b; transform: translate(-2px,0); }
      94% { fill: #2bd8ff; transform: translate(2px,0); }
      95% { fill: #39ff14; transform: translate(0,0); }
    }
  ]]>
  </style>

  <rect x="4" y="4" width="692" height="252" rx="10" class="win"/>
  <circle cx="26" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="26" r="6" fill="#27c93f"/>
  <text x="350" y="30" text-anchor="middle" class="title">aswin@saavibuddy: ~/agentic-stack</text>
  <line x1="4" y1="44" x2="696" y2="44" stroke="#1a3a1a"/>

  <text id="l1" x="24" y="80"  class="line reveal">$ ./init_agent.sh --mode=agentic</text>
  <text id="l2" x="24" y="110" class="line dim reveal glitch">[OK] CrewAI orchestrator online</text>
  <text id="l3" x="24" y="140" class="line dim reveal">[OK] RAG pipeline connected — Fusion + Self-RAG</text>
  <text id="l4" x="24" y="170" class="line dim reveal">[OK] Guardrails armed — NeMo / Llama Guard</text>
  <text id="l5" x="24" y="210" class="line bright reveal">&gt; deploying SAAVIBUDDY... status: closing deals while you sleep</text>
  <rect x="24" y="222" width="11" height="18" fill="#39ff14" class="cursor"/>
</svg>
